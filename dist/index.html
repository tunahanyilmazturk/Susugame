<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0457b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1724" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kelimeler">
<meta name="mobile-web-app-capable" content="yes">
<title>Karışık Kelimeler</title>
<style>
/* ---- Renk tokenları ---- */
:root {
  --bg: #fff5f8;
  --card: #ffffff;
  --ink: #2d2233;
  --muted: #7a6b80;
  --accent: #e0457b;
  --accent-ink: #ffffff;
  --ok: #2e9e6a;
  --bad: #d64545;
  --tile: #ffe3ec;
  --tile-ink: #8a1f4b;
  --line: #f0d9e3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1724;
    --card: #2a2233;
    --ink: #f6eefa;
    --muted: #b3a4bd;
    --accent: #ff6d9a;
    --accent-ink: #1d1724;
    --ok: #5fd29a;
    --bad: #ff7676;
    --tile: #3b2f47;
    --tile-ink: #ffd6e6;
    --line: #3d3250;
  }
}

/* ---- Temel ---- */
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh; /* mobil tarayıcı çubukları açıkken de tam yükseklik */
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-text-size-adjust: 100%;
  /* Çentik ve alt çubuk payı; en az 16px kenar boşluğu */
  padding:
    max(16px, env(safe-area-inset-top, 0px))
    max(16px, env(safe-area-inset-right, 0px))
    max(16px, env(safe-area-inset-bottom, 0px))
    max(16px, env(safe-area-inset-left, 0px));
}
.card {
  width: 100%;
  max-width: 520px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
}
h1 { margin: 0 0 4px; font-size: 1.6rem; text-align: center; }
.sub { margin: 0 0 20px; text-align: center; color: var(--muted); font-size: 0.95rem; }
.hidden { display: none !important; }
label { display: block; font-size: 0.9rem; color: var(--muted); margin: 12px 0 6px; }
input[type="text"], input.name, select {
  width: 100%;
  padding: 12px 14px;
  font-size: 1.05rem;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
  color: var(--ink);
  outline: none;
}
input:focus, select:focus { border-color: var(--accent); }
select { appearance: auto; }
button {
  font: inherit;
  border: none;
  border-radius: 12px;
  padding: 12px 16px;
  min-height: 44px; /* Apple ve Google'ın önerdiği dokunma alanı */
  touch-action: manipulation; /* çift dokunma zoom gecikmesini kaldırır */
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
  background: var(--line);
  color: var(--ink);
  font-weight: 600;
}
button:disabled { opacity: 0.45; cursor: default; }
button.primary {
  background: var(--accent);
  color: var(--accent-ink);
  width: 100%;
  margin-top: 18px;
  font-size: 1.05rem;
}
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---- Skorlar ---- */
.scores { display: flex; gap: 10px; }
.score {
  flex: 1;
  min-width: 0;
  text-align: center;
  padding: 10px;
  border-radius: 14px;
  border: 2px solid var(--line);
}
.score.turn { border-color: var(--accent); }
.score .n { font-size: 0.85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score .p { font-size: 1.6rem; font-weight: 700; }

/* ---- Tur ---- */
.round-info { text-align: center; margin: 18px 0 6px; color: var(--muted); font-size: 0.95rem; }
.category-row { display: flex; justify-content: center; }
.category {
  font-size: 0.85rem;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--line);
  color: var(--ink);
}
.tiles {
  --tile-w: 48px; /* ui.js ekran genişliğine göre günceller */
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  min-height: 64px;
  margin: 10px 0 14px;
}
.tile {
  width: var(--tile-w);
  height: calc(var(--tile-w) * 1.17);
  font-size: calc(var(--tile-w) * 0.5);
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  border-radius: 12px;
  background: var(--tile);
  color: var(--tile-ink);
  animation: pop 0.3s ease both;
}
.tile.reveal { background: var(--ok); color: #fff; }
.tile.hint { background: transparent; border: 2px dashed var(--accent); color: var(--accent); }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.msg { min-height: 24px; text-align: center; font-weight: 600; margin: 6px 0 4px; }
.msg.ok { color: var(--ok); }
.msg.bad { color: var(--bad); }
.msg.info { color: var(--muted); font-weight: 500; }

.shake { animation: shake 0.4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}

/* ---- Girdi ve eylemler ---- */
.guess-row { display: flex; gap: 8px; margin-top: 8px; }
.guess-row input { flex: 1; min-width: 0; text-align: center; }
.guess-row button { padding: 12px 20px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.actions button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 12px 6px; }
.actions button small { font-size: 0.75rem; font-weight: 500; color: var(--muted); }
.actions button:disabled small { color: inherit; }
.footer-actions { margin-top: 18px; text-align: center; }
.footer-actions button { background: transparent; color: var(--muted); font-weight: 500; font-size: 0.9rem; }

/* Dar ekranlar (küçük telefonlar) */
@media (max-width: 380px) {
  .card { padding: 18px; border-radius: 16px; }
  h1 { font-size: 1.35rem; }
  .score .p { font-size: 1.3rem; }
  .actions button { font-size: 0.9rem; }
}

/* Yatay telefon ve kısa ekranlarda kartın taşmasını önler */
@media (max-height: 560px) {
  body { align-items: flex-start; }
  .card { margin: 0 auto; }
}

@media (prefers-reduced-motion: reduce) {
  .tile, .shake { animation: none; }
}
</style>
</head>
<body>
<div class="card" id="app">

  <!-- Kurulum ekranı -->
  <section id="setup">
    <h1>🔤 Karışık Kelimeler</h1>
    <p class="sub">Harfler karıştırılır, doğrusunu birlikte bulmaya çalışın!</p>
    <label for="p1">1. oyuncu</label>
    <input class="name" id="p1" maxlength="16" value="Oyuncu 1">
    <label for="p2">2. oyuncu</label>
    <input class="name" id="p2" maxlength="16" value="Oyuncu 2">
    <label for="rounds">Tur sayısı</label>
    <select id="rounds">
      <option value="5">5 tur</option>
      <option value="10" selected>10 tur</option>
      <option value="15">15 tur</option>
      <option value="0">Sınırsız</option>
    </select>
    <button class="primary" id="startBtn">Oyuna Başla</button>
  </section>

  <!-- Oyun ekranı -->
  <section id="game" class="hidden">
    <div class="scores" id="scores"></div>
    <div class="round-info" id="roundInfo"></div>
    <div class="category-row"><span class="category" id="category"></span></div>
    <div class="tiles" id="tiles"></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <div class="guess-row" id="guessRow">
      <input type="text" id="guess" placeholder="Doğru kelimeyi yaz" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" inputmode="text">
      <button class="primary-small" id="guessBtn">Tahmin</button>
    </div>

    <div class="actions" id="actions">
      <button id="shuffleBtn">🔀 Karıştır</button>
      <button id="hintBtn">💡 İpucu <small>-5 puan</small></button>
      <button id="passBtn">⏭ Pas</button>
    </div>
    <div class="actions hidden" id="nextRow">
      <button class="primary" id="nextBtn">Sonraki Kelime ▶</button>
    </div>

    <div class="footer-actions">
      <button id="endBtn">Oyunu bitir</button>
    </div>
  </section>

  <!-- Oyun sonu paneli -->
  <section id="endPanel" class="hidden">
    <h1>🏁 Oyun bitti</h1>
    <p class="sub" id="finalText"></p>
    <button class="primary" id="restartBtn">Yeni oyun</button>
  </section>

</div>
